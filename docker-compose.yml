services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: brainworks
      POSTGRES_PASSWORD: brainworks
      POSTGRES_DB: brainworks
    ports:
      - "5432:5432"
    volumes:
      - brainworks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainworks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brainworks-pgdata:
