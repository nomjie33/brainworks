name: E2E

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  e2e:
    name: Playwright against Vercel preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            deployment_id=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Preview" --jq '.[0].id // empty')
            if [ -n "$deployment_id" ]; then
              status=$(gh api "repos/${{ github.repository }}/deployments/$deployment_id/statuses" --jq '.[0] // empty')
              state=$(echo "$status" | jq -r '.state // empty')
              if [ "$state" = "success" ]; then
                url=$(echo "$status" | jq -r '.environment_url')
                echo "Preview ready: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel deployment $state"
                exit 1
              fi
            fi
            echo "Waiting for preview ($attempt/60)..."
            sleep 10
          done
          echo "Timed out waiting for the Vercel preview"
          exit 1

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
